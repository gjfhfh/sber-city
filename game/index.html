<div id="app">
<canvas id="city" aria-label="Трёхмерный город Сбера: в центре главное здание, вокруг острова-отделы"></canvas>
<div id="labels" aria-hidden="false"></div>
<div id="fallback-map" hidden></div>

<header id="hud" hidden>
  <div class="hud-row">
    <div class="months" id="months" aria-label="Месяц"></div>
    <button class="icon-btn" id="menu" type="button" aria-label="Меню: выйти из игры"><svg><use href="#i-exit"/></svg></button>
  </div>
  <div class="meters" id="meters">
    <div class="meter" data-k="coins"><svg class="mi"><use href="#i-coin"/></svg><div class="mv"><b id="v-coins">0</b><span>Прибыль</span></div><i class="dot"></i></div>
    <div class="meter" data-k="shields"><svg class="mi"><use href="#i-shield"/></svg><div class="mv"><b id="v-shields">8</b><span>Надёжность</span></div><i class="dot"></i></div>
    <div class="meter" data-k="hearts"><svg class="mi"><use href="#i-heart"/></svg><div class="mv"><b id="v-hearts">6</b><span>Доверие</span></div><i class="dot"></i></div>
  </div>
</header>
<button class="icon-btn floating" id="sound" type="button" aria-label="Звук выключен" aria-pressed="false"><svg><use href="#i-mute"/></svg></button>

<button class="icon-btn floating quit" id="quit" type="button" aria-label="Выйти из игры"><svg><use href="#i-exit"/></svg></button>

<main id="panel" class="panel" aria-live="polite"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden></div>
</div>

<script src="content/fallback.js"></script>
<script src="engine.js"></script>
<script src="city3d.js"></script>
<script src="audio.js"></script>
<script src="ui.js"></script>
</body>
</html>
